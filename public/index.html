<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mistral Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        background: light-dark(#fafafa, #111);
        color: light-dark(#1a1a1a, #eee);
      }
      header {
        padding: 0.75rem 1rem;
        font-weight: 600;
        border-bottom: 1px solid light-dark(#e0e0e0, #333);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      header small {
        font-weight: 400;
        opacity: 0.7;
      }
      #key-btn {
        font-size: 0.8rem;
        padding: 0.3rem 0.7rem;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .msg {
        max-width: 75%;
        padding: 0.5rem 0.85rem;
        border-radius: 1rem;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.4;
      }
      .user {
        align-self: flex-end;
        background: #2563eb;
        color: #fff;
        border-bottom-right-radius: 0.25rem;
      }
      .assistant {
        align-self: flex-start;
        background: light-dark(#e5e7eb, #2a2a2a);
        border-bottom-left-radius: 0.25rem;
      }
      .error {
        align-self: center;
        color: #dc2626;
        font-size: 0.85rem;
      }
      .hint {
        align-self: center;
        opacity: 0.6;
        font-size: 0.9rem;
        text-align: center;
      }
      form {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid light-dark(#e0e0e0, #333);
      }
      input {
        flex: 1;
        padding: 0.6rem 0.85rem;
        border-radius: 0.6rem;
        border: 1px solid light-dark(#ccc, #444);
        background: light-dark(#fff, #1c1c1c);
        color: inherit;
        font: inherit;
      }
      button {
        padding: 0.6rem 1.1rem;
        border: none;
        border-radius: 0.6rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      dialog {
        border: 1px solid light-dark(#ccc, #444);
        border-radius: 0.75rem;
        background: light-dark(#fff, #1c1c1c);
        color: inherit;
        padding: 1.25rem;
        width: min(26rem, 90vw);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      dialog h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      dialog p {
        margin: 0 0 0.75rem;
        font-size: 0.85rem;
        opacity: 0.75;
        line-height: 1.4;
      }
      .dialog-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 0.75rem;
      }
      .secondary {
        background: light-dark(#e5e7eb, #2a2a2a);
        color: inherit;
      }
    </style>
  </head>
  <body>
    <header>
      <span>Mistral Chat <small>(mistral-small-latest)</small></span>
      <button id="key-btn" type="button">API kľúč</button>
    </header>

    <dialog id="key-dialog">
      <h2>Mistral API kľúč</h2>
      <p>
        Kľúč si vytvoríš na
        <a href="https://console.mistral.ai/" target="_blank" rel="noopener">console.mistral.ai</a>.
        Uloží sa len v tomto prehliadači (localStorage) a posielajú sa s ním požiadavky priamo na
        api.mistral.ai — nikdy sa neukladá na server ani do repozitára.
      </p>
      <form id="key-form">
        <input id="key-input" type="password" placeholder="Skryté — pre zobrazenie klikni na ikonu" autocomplete="off" />
        <div class="dialog-actions">
          <button type="button" class="secondary" id="key-remove">Odstrániť</button>
          <button type="submit">Uložiť</button>
        </div>
      </form>
    </dialog>

    <div id="chat"></div>

    <form id="form">
      <input id="input" type="text" placeholder="Napíš správu…" autocomplete="off" autofocus />
      <button type="submit">Poslať</button>
    </form>

    <script>
      const API_URL = "https://api.mistral.ai/v1/chat/completions";
      const MODEL = "mistral-small-latest";
      const KEY_STORAGE = "mistral_api_key";

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const button = form.querySelector("button");
      const keyBtn = document.getElementById("key-btn");
      const keyDialog = document.getElementById("key-dialog");
      const keyForm = document.getElementById("key-form");
      const keyInput = document.getElementById("key-input");
      const keyRemove = document.getElementById("key-remove");
      const messages = [];

      function getKey() {
        return localStorage.getItem(KEY_STORAGE) || "";
      }

      function addBubble(text, className) {
        const div = document.createElement("div");
        div.className = "msg " + className;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      function showHint() {
        addBubble(
          "Vitaj! Najprv si ulož svoj Mistral API kľúč — klikni na „API kľúč“ hore.",
          "hint"
        );
      }

      keyBtn.addEventListener("click", () => {
        keyInput.value = getKey();
        keyDialog.showModal();
      });

      keyRemove.addEventListener("click", () => {
        localStorage.removeItem(KEY_STORAGE);
        keyDialog.close();
      });

      keyForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const key = keyInput.value.trim();
        if (key) localStorage.setItem(KEY_STORAGE, key);
        else localStorage.removeItem(KEY_STORAGE);
        keyDialog.close();
        input.focus();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const key = getKey();
        if (!key) {
          addBubble("Najprv zadaj API kľúč (tlačidlo „API kľúč“ hore).", "error");
          keyDialog.showModal();
          return;
        }
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        button.disabled = true;
        addBubble(text, "user");
        messages.push({ role: "user", content: text });
        const pending = addBubble("…", "assistant");

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + key,
            },
            body: JSON.stringify({ model: MODEL, messages }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const detail = data.message || data.detail || res.statusText;
            throw new Error("Chyba " + res.status + ": " + detail);
          }
          const raw = data.choices?.[0]?.message?.content ?? "";
          const reply =
            typeof raw === "string" ? raw : raw.map((c) => c?.text ?? "").join("");
          pending.textContent = reply;
          messages.push({ role: "assistant", content: reply });
        } catch (err) {
          pending.remove();
          messages.pop();
          addBubble(err.message, "error");
        } finally {
          button.disabled = false;
          input.focus();
        }
      });

      if (!getKey()) showHint();
    </script>
  </body>
</html>
