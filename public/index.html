<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mistral Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        background: light-dark(#fafafa, #111);
        color: light-dark(#1a1a1a, #eee);
      }
      header {
        padding: 0.75rem 1rem;
        font-weight: 600;
        border-bottom: 1px solid light-dark(#e0e0e0, #333);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      header small {
        font-weight: 400;
        opacity: 0.7;
      }
      #settings-btn {
        font-size: 0.8rem;
        padding: 0.3rem 0.7rem;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .msg {
        max-width: 75%;
        padding: 0.5rem 0.85rem;
        border-radius: 1rem;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.4;
      }
      .user {
        align-self: flex-end;
        background: #2563eb;
        color: #fff;
        border-bottom-right-radius: 0.25rem;
      }
      .assistant {
        align-self: flex-start;
        background: light-dark(#e5e7eb, #2a2a2a);
        border-bottom-left-radius: 0.25rem;
      }
      .error {
        align-self: center;
        color: #dc2626;
        font-size: 0.85rem;
      }
      .hint {
        align-self: center;
        opacity: 0.6;
        font-size: 0.9rem;
        text-align: center;
      }
      form#composer {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid light-dark(#e0e0e0, #333);
      }
      input, select {
        padding: 0.6rem 0.85rem;
        border-radius: 0.6rem;
        border: 1px solid light-dark(#ccc, #444);
        background: light-dark(#fff, #1c1c1c);
        color: inherit;
        font: inherit;
      }
      form#composer input {
        flex: 1;
      }
      button {
        padding: 0.6rem 1.1rem;
        border: none;
        border-radius: 0.6rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      dialog {
        border: 1px solid light-dark(#ccc, #444);
        border-radius: 0.75rem;
        background: light-dark(#fff, #1c1c1c);
        color: inherit;
        padding: 1.25rem;
        width: min(28rem, 92vw);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      dialog h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      dialog p {
        margin: 0 0 0.75rem;
        font-size: 0.85rem;
        opacity: 0.75;
        line-height: 1.4;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-bottom: 0.6rem;
      }
      .field label {
        font-size: 0.78rem;
        opacity: 0.7;
      }
      .field input, .field select {
        width: 100%;
        box-sizing: border-box;
      }
      .dialog-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 0.75rem;
      }
      .secondary {
        background: light-dark(#e5e7eb, #2a2a2a);
        color: inherit;
      }
    </style>
  </head>
  <body>
    <header>
      <span>Mistral Chat <small id="model-label"></small></span>
      <button id="settings-btn" type="button">Nastavenia</button>
    </header>

    <dialog id="settings-dialog">
      <h2>Nastavenia pripojenia</h2>
      <p id="provider-hint"></p>
      <form id="settings-form">
        <div class="field">
          <label for="provider-select">Poskytovateľ</label>
          <select id="provider-select"></select>
        </div>
        <div class="field">
          <label for="base-input">API URL (OpenAI-kompatibilná, vrátane /v1)</label>
          <input id="base-input" type="url" placeholder="https://api.mistral.ai/v1" autocomplete="off" />
        </div>
        <div class="field">
          <label for="model-input">Model</label>
          <input id="model-input" type="text" placeholder="mistral-small-latest" autocomplete="off" />
        </div>
        <div class="field">
          <label for="key-input">API kľúč</label>
          <input id="key-input" type="password" placeholder="Nepovinný pre lokálne modely" autocomplete="off" />
        </div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="settings-reset">Obnoviť predvolené</button>
          <button type="submit">Uložiť</button>
        </div>
      </form>
    </dialog>

    <div id="chat"></div>

    <form id="composer">
      <input id="input" type="text" placeholder="Napíš správu…" autocomplete="off" autofocus />
      <button type="submit">Poslať</button>
    </form>

    <script>
      const PRESETS = {
        mistral: {
          label: "Mistral API (platný plán)",
          base: "https://api.mistral.ai/v1",
          model: "mistral-small-latest",
          keyUrl: "https://console.mistral.ai/",
          hint: "Pozor: Mistral od októbra 2026 neaktivuje API kľúče na Free pláne — potrebný je platený plán (Pro alebo pay-as-you-go). Kľúč z console.mistral.ai.",
        },
        openrouter: {
          label: "OpenRouter (zdarma)",
          base: "https://openrouter.ai/api/v1",
          model: "openrouter/free",
          keyUrl: "https://openrouter.ai/settings/keys",
          hint: "Bezplatný prístup: 20 požiadaviek/min, 50/deň. Model „openrouter/free“ automaticky vyberie aktuálne dostupný bezplatný model; konkrétne :free modely nájdeš na openrouter.ai/models.",
        },
        nvidia: {
          label: "NVIDIA NIM (zdarma)",
          base: "https://integrate.api.nvidia.com/v1",
          model: "mistralai/mistral-nemotron",
          keyUrl: "https://build.nvidia.com/",
          hint: "Kľúč nvapi-… po bezplatnej registrácii do NVIDIA Developer Program (~40 požiadaviek/min). Presné ID modelu skopíruj zo stránky konkrétneho modelu na build.nvidia.com.",
        },
        ollama: {
          label: "Ollama (lokálne, zdarma)",
          base: "http://localhost:11434/v1",
          model: "mistral",
          keyUrl: "https://ollama.com/download",
          hint: "Spusti Ollama a stiahni model príkazom „ollama pull mistral“. Kľúč nie je potrebný. Model beží na tvojom počítači.",
        },
        custom: {
          label: "Vlastné…",
          base: "",
          model: "",
          keyUrl: "",
          hint: "Zadaj ľubovoľnú OpenAI-kompatibilnú adresu (napr. http://localhost:11434/v1 pre Ollamu alebo URL tvojho proxy servera).",
        },
      };

      const STORAGE = {
        provider: "chat_provider",
        base: "chat_base_url",
        model: "chat_model",
        key: "chat_api_key",
      };

      const chat = document.getElementById("chat");
      const composer = document.getElementById("composer");
      const input = document.getElementById("input");
      const sendBtn = composer.querySelector("button");
      const settingsBtn = document.getElementById("settings-btn");
      const dialog = document.getElementById("settings-dialog");
      const providerSelect = document.getElementById("provider-select");
      const baseInput = document.getElementById("base-input");
      const modelInput = document.getElementById("model-input");
      const keyInput = document.getElementById("key-input");
      const providerHint = document.getElementById("provider-hint");
      const resetBtn = document.getElementById("settings-reset");
      const modelLabel = document.getElementById("model-label");
      const messages = [];

      for (const [id, preset] of Object.entries(PRESETS)) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = preset.label;
        providerSelect.appendChild(opt);
      }

      function getCfg() {
        const provider = localStorage.getItem(STORAGE.provider) || "mistral";
        const preset = PRESETS[provider] || PRESETS.mistral;
        return {
          provider,
          base: localStorage.getItem(STORAGE.base) ?? preset.base,
          model: localStorage.getItem(STORAGE.model) ?? preset.model,
          key: localStorage.getItem(STORAGE.key) || "",
        };
      }

      function isLocal(base) {
        return /\/\/(localhost|127\.0\.0\.1|\[::1\])/.test(base);
      }

      function updateHeader() {
        modelLabel.textContent = "(" + (getCfg().model || "model nenastavený") + ")";
      }

      function syncDialog() {
        const cfg = getCfg();
        providerSelect.value = cfg.provider;
        if (!PRESETS[cfg.provider]) providerSelect.value = "mistral";
        baseInput.value = cfg.base;
        modelInput.value = cfg.model;
        keyInput.value = cfg.key;
        providerHint.textContent = PRESETS[providerSelect.value].hint;
      }

      settingsBtn.addEventListener("click", () => {
        syncDialog();
        dialog.showModal();
      });

      providerSelect.addEventListener("change", () => {
        const preset = PRESETS[providerSelect.value];
        baseInput.value = preset.base;
        modelInput.value = preset.model;
        providerHint.textContent = preset.hint;
      });

      resetBtn.addEventListener("click", () => {
        Object.values(STORAGE).forEach((k) => localStorage.removeItem(k));
        syncDialog();
        updateHeader();
      });

      document.getElementById("settings-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const provider = providerSelect.value;
        const base = baseInput.value.trim().replace(/\/+$/, "");
        const model = modelInput.value.trim();
        if (!base || !model) {
          providerHint.textContent = "API URL a model sú povinné.";
          return;
        }
        localStorage.setItem(STORAGE.provider, provider);
        localStorage.setItem(STORAGE.base, base);
        localStorage.setItem(STORAGE.model, model);
        const key = keyInput.value.trim();
        if (key) localStorage.setItem(STORAGE.key, key);
        else localStorage.removeItem(STORAGE.key);
        dialog.close();
        updateHeader();
        input.focus();
      });

      function addBubble(text, className) {
        const div = document.createElement("div");
        div.className = "msg " + className;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      function showHint() {
        addBubble(
          'Vitaj! Klikni na „Nastavenia“ a vyber poskytovateľa — Mistral (platený plán), OpenRouter alebo NVIDIA NIM (zdarma), či lokálnu Ollamu.',
          "hint"
        );
      }

      composer.addEventListener("submit", async (e) => {
        e.preventDefault();
        const cfg = getCfg();
        if (!cfg.base || !cfg.model) {
          addBubble("Najprv nastav poskytovateľa (tlačidlo „Nastavenia“ hore).", "error");
          syncDialog();
          dialog.showModal();
          return;
        }
        if (!cfg.key && !isLocal(cfg.base)) {
          addBubble("Chýba API kľúč — doplň ho v nastaveniach.", "error");
          syncDialog();
          dialog.showModal();
          return;
        }
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        sendBtn.disabled = true;
        addBubble(text, "user");
        messages.push({ role: "user", content: text });
        const pending = addBubble("…", "assistant");

        try {
          const headers = { "Content-Type": "application/json" };
          if (cfg.key) headers.Authorization = "Bearer " + cfg.key;
          const res = await fetch(cfg.base + "/chat/completions", {
            method: "POST",
            headers,
            body: JSON.stringify({ model: cfg.model, messages }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const detail = data.error?.message || data.message || data.detail || res.statusText;
            throw new Error("Chyba " + res.status + ": " + detail);
          }
          const raw = data.choices?.[0]?.message?.content ?? "";
          const reply =
            typeof raw === "string" ? raw : raw.map((c) => c?.text ?? "").join("");
          pending.textContent = reply;
          messages.push({ role: "assistant", content: reply });
        } catch (err) {
          pending.remove();
          messages.pop();
          addBubble(err.message, "error");
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      });

      updateHeader();
      if (!getCfg().base || !getCfg().model) showHint();
    </script>
  </body>
</html>
