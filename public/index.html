<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mistral Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        background: light-dark(#fafafa, #111);
        color: light-dark(#1a1a1a, #eee);
      }
      header {
        padding: 0.75rem 1rem;
        font-weight: 600;
        border-bottom: 1px solid light-dark(#e0e0e0, #333);
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .msg {
        max-width: 75%;
        padding: 0.5rem 0.85rem;
        border-radius: 1rem;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.4;
      }
      .user {
        align-self: flex-end;
        background: light-dark(#2563eb, #2563eb);
        color: #fff;
        border-bottom-right-radius: 0.25rem;
      }
      .assistant {
        align-self: flex-start;
        background: light-dark(#e5e7eb, #2a2a2a);
        border-bottom-left-radius: 0.25rem;
      }
      .error {
        align-self: center;
        color: #dc2626;
        font-size: 0.85rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid light-dark(#e0e0e0, #333);
      }
      input {
        flex: 1;
        padding: 0.6rem 0.85rem;
        border-radius: 0.6rem;
        border: 1px solid light-dark(#ccc, #444);
        background: light-dark(#fff, #1c1c1c);
        color: inherit;
        font: inherit;
      }
      button {
        padding: 0.6rem 1.1rem;
        border: none;
        border-radius: 0.6rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>Mistral Chat <small>(mistral-small-latest)</small></header>
    <div id="chat"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Type a message…" autocomplete="off" autofocus />
      <button type="submit">Send</button>
    </form>
    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const button = form.querySelector("button");
      const messages = [];

      function addBubble(text, className) {
        const div = document.createElement("div");
        div.className = "msg " + className;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        button.disabled = true;
        addBubble(text, "user");
        messages.push({ role: "user", content: text });
        const pending = addBubble("…", "assistant");

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Request failed");
          pending.textContent = data.reply;
          messages.push({ role: "assistant", content: data.reply });
        } catch (err) {
          pending.remove();
          messages.pop();
          addBubble(err.message, "error");
        } finally {
          button.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
